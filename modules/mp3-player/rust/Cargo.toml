[package]
name = "unidtk-mod-mp3-player"
version = "0.1.0"
edition = "2021"
description = "MP3 player vertical slice (playback, library, sync, AI DJ, spectrum capture)"

# Vertical slice for the `mp3-player` module. Sources were `modules/music/src/*`
# (with the spectrum visualiser `modules/audio/audio.rs` folded in). Dependencies
# are only the crates this module actually references.
#
# Lib-only crate: the kernel pulls it in as a Cargo path dependency
# (`unidtk-mod-mp3-player`) and holds the Tauri command wrappers; the module
# itself talks to the kernel only through `unidtk-api`. It builds standalone, and
# every dependency below (tauri for `AppHandle`/`Emitter`/`async_runtime`) is
# required by this crate. Storage is *not* a dependency: the module asks the
# kernel for a store (`ModuleContext::store`) and gets a `ModuleDb` back, so no
# `redb` here — the database engine stays inside the kernel.

[lib]
name = "unidtk_mod_mp3_player"
path = "lib.rs"

[dependencies]
unidtk-api = { path = "../../../core/api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
dirs = "5"
cpal = "0.17"
rustfft = "6.4"
ort = { version = "2.0.0-rc.13" }
symphonia = { version = "0.5", features = ["mp3", "flac", "ogg", "wav", "aac", "isomp4", "alac", "vorbis"] }
tauri = { version = "2" }
tokio = { version = "1", features = ["rt", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
# Докачка AI DJ модели: HTTPS-клиент (дефолт = rustls, без openssl) с
# SOCKS-транспортом для обхода локальной сети и SHA-256 для проверки целостности.
ureq = { version = "2", features = ["socks-proxy"] }
sha2 = "0.10"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_Media_KernelStreaming",
  "Win32_System_Com"
]
