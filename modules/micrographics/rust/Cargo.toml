[package]
name = "unidtk-mod-micrographics"
version = "0.1.0"
edition = "2021"
description = "Micrographics vertical slice (ambient weather feed for the desktop panel)"

# Vertical slice for the `micrographics` module: the Rust half fetches and
# caches the current weather, the `ui/` half composes it into the ambient
# desktop panel. Talks to the kernel strictly through `unidtk-api`: no
# dependency on the kernel crate, none on other modules.

[lib]
name = "unidtk_mod_micrographics"
path = "micrographics.rs"

[dependencies]
unidtk-api = { path = "../../../core/api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["socks-proxy"] }
# The host types only: `init` registers the runtime with the host for the
# kernel's location-permission window. The commands are this crate's own table.
tauri = { version = "2" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = ["Devices_Geolocation", "Foundation", "Win32_System_WinRT"]
