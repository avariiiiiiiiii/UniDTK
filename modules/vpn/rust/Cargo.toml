[package]
name = "unidtk-mod-vpn"
version = "0.1.0"
edition = "2021"
description = "VPN vertical slice (sing-box subscription, TUN, elevated helper bridge)"

# Vertical slice for the `vpn` module. Talks to the kernel strictly through
# `unidtk-api`: no dependency on the kernel crate, none on other modules.

[lib]
name = "unidtk_mod_vpn"
path = "vpn.rs"

[dependencies]
unidtk-api = { path = "../../../core/api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2", features = ["socks-proxy"] }
base64 = "0.22"
tauri = { version = "2" }
