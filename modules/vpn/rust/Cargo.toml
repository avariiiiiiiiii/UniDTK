[package]
name = "unidtk-mod-vpn"
version = "0.1.0"
edition = "2021"
description = "VPN vertical slice (sing-box subscription, TUN, elevated helper bridge)"

# Vertical slice for the `vpn` module. Talks to the kernel strictly through
# `unidtk-api`: no dependency on the kernel crate, none on other modules.

[lib]
name = "unidtk_mod_vpn"
path = "vpn.rs"

[dependencies]
unidtk-api = { path = "../../../core/api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
ureq = { version = "2", features = ["socks-proxy"] }
base64 = "0.22"
tauri = { version = "2" }
# The device id a provider's device limit counts (`hwid.rs`); the workspace already
# builds sha2 0.10, so this adds no crate.
sha2 = "0.10"

# `GetAdaptersAddresses`: which IPv4 ranges an adapter already holds, so the TUN
# never asks for an address another client (Happ, Tailscale, ZeroTier) owns.
# Same `windows` version as the rest of the workspace, so the feature union adds
# no crate (and no build time).
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock",
  # The server check's sing-box closes with the kernel (`dies_with_kernel`).
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
  # The machine's id, the Windows version and the model for the device headers.
  "Win32_System_Registry"
]
