[package]
name = "unidtk"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Single manifest for the whole application: the app itself, the CLI debug bridge
# and the elevated VPN helper. Sources live next to their domain in the workspace
# (../core/kernel, ../opt/...). This is the only package with binaries.

[[bin]]
name = "unidtk"
path = "../core/kernel/main.rs"

[[bin]]
name = "udtk"
path = "../opt/cli/main.rs"

[[bin]]
name = "vpn-helper"
path = "../modules/vpn/helper/main.rs"

# The native desktop host on Rune (docs/dev/plan-rune-host.md), a process of its own
# until the switch: Tauri runs on tao and Rune on winit, and one main thread cannot run both.
[[bin]]
name = "unidtk-desktop"
path = "../core/desktop/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# The stable module contract (kernel and modules both depend on it).
unidtk-api = { path = "../core/api" }
# Migrated module crates (each talks to the kernel only through unidtk-api).
unidtk-mod-glyph-bar = { path = "../modules/glyph-bar/rust" }
unidtk-mod-vpn = { path = "../modules/vpn/rust" }
unidtk-mod-telegram = { path = "../modules/telegram/rust" }
unidtk-mod-explorer = { path = "../modules/explorer/rust" }
unidtk-mod-mp3-player = { path = "../modules/mp3-player/rust" }
unidtk-mod-micrographics = { path = "../modules/micrographics/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
redb = "2.1"
pulldown-cmark = { version = "0.13", default-features = false, features = ["html"] }
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png", "devtools"] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
mimalloc = { version = "0.1", default-features = false }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }
# The desktop host's engine, our copy of Rune (core/rune/UPSTREAM.md), the window
# handle type Rune lends out, and the encoder of the host's inspector shots.
rune = { path = "../core/rune/rune" }
# The native desk as a library; `unidtk-desktop` (../core/desktop/main.rs) is its binary.
unidtk-shell = { path = "../core/desktop" }
# The modules' native halves, registered in ../core/desktop/main.rs.
unidtk-native-clock = { path = "../modules/clock/native" }
unidtk-native-glyph-bar = { path = "../modules/glyph-bar/native" }
unidtk-native-vpn = { path = "../modules/vpn/native" }
# The music player's native half, built only with `mp3-native` until the port is whole
# (session 152): nothing of it reaches the desk before then. The gate goes with the port.
unidtk-native-mp3-player = { path = "../modules/mp3-player/native", optional = true }
raw-window-handle = "0.6"
png = "0.18"
base64 = "0.22"

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_UI_Input",
  "Win32_Networking_WinInet",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_Xps",
  "Win32_UI_HiDpi",
  "Win32_System_ProcessStatus",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_KernelStreaming",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_JobObjects",
  "Win32_System_Pipes",
  "Win32_Storage_FileSystem",
  "Win32_System_Ioctl",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_UI_Shell",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock"
]

[features]
# Off by default: the music player's native half joins the desk only when it is whole.
mp3-native = ["dep:unidtk-native-mp3-player"]
