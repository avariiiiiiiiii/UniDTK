[package]
name = "unidtk"
version = "0.1.0"
edition = "2021"
build = "build.rs"

# Single manifest for the whole application: the app itself, the CLI debug bridge
# and the elevated VPN helper. Sources live next to their domain in the workspace
# (../core/kernel, ../opt/...). This is the only package with binaries.

[[bin]]
name = "unidtk"
path = "../core/kernel/main.rs"

[[bin]]
name = "udtk"
path = "../opt/cli/main.rs"

[[bin]]
name = "vpn-helper"
path = "../modules/vpn/helper/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }
serde_json = "1"

[dependencies]
# The stable module contract (kernel and modules both depend on it).
unidtk-api = { path = "../core/api" }
# Migrated module crates (each talks to the kernel only through unidtk-api).
unidtk-mod-glyph-bar = { path = "../modules/glyph-bar/rust" }
unidtk-mod-vpn = { path = "../modules/vpn/rust" }
unidtk-mod-telegram = { path = "../modules/telegram/rust" }
unidtk-mod-explorer = { path = "../modules/explorer/rust" }
unidtk-mod-mp3-player = { path = "../modules/mp3-player/rust" }
unidtk-mod-micrographics = { path = "../modules/micrographics/rust" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"
redb = "2.1"
crossbeam-channel = "0.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
dirs = "5"
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
mimalloc = { version = "0.1", default-features = false }
tungstenite = { version = "0.24", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
  "Win32_UI_Input",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Devices_HumanInterfaceDevice",
  "Win32_Media_Audio",
  "Win32_Media_Audio_Endpoints",
  "Win32_Media_KernelStreaming",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
  "Win32_System_Ioctl",
  "Win32_System_Registry",
  "Win32_System_Shutdown",
  "Win32_UI_Shell",
  "Win32_NetworkManagement_IpHelper",
  "Win32_NetworkManagement_Ndis",
  "Win32_Networking_WinSock"
]
