<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UniDTK</title>
  <script>
  // Zero-FOUC pre-paint: applies the token map theme.js cached last session
  // (computeThemeVars / computeThemeAttrs) — no hand-kept mirror here.
  // Classic script (not a module) so it runs before stylesheets apply.
  // Read-only: never writes storage, never persists.
  (function () {
    try {
      var paint = JSON.parse(localStorage.getItem("unidtk_theme_state") || "{}").paint;
      if (!paint || typeof paint !== "object") return;
      var root = document.documentElement;
      var vars = paint.vars || {}, attrs = paint.attrs || {};
      for (var k in vars) if (k.indexOf("--") === 0) root.style.setProperty(k, String(vars[k]));
      for (var a in attrs) root.dataset[a] = String(attrs[a]);
    } catch (e) { /* cache corrupt: fall back to :root defaults */ }
  })();
  </script>
  <link rel="preload" href="assets/fonts/Geist/Geist[wght].woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="../styles.css" />
  <link rel="stylesheet" href="../modules/clock/clock.css" />
  <link rel="stylesheet" href="../modules/clock/gooey.css" />
  <link rel="stylesheet" href="../modules/micrographics/micrographics.css" />
  <link rel="stylesheet" href="../modules/mp3-player/mp3-player.css" />
  <link rel="stylesheet" href="../modules/glyph-bar/glyph-bar.css" />
  <link rel="stylesheet" href="../modules/telegram/telegram.css" />
  <link rel="stylesheet" href="../modules/explorer/explorer.css" />
  <link rel="stylesheet" href="menu.css" />
  <script type="importmap">
  {
    "imports": {
      "@unidtk/bridge": "./unidtk-bridge.js",
      "@tauri-apps/api/core": "../assets/vendor/@tauri-apps/api/core.js",
      "@tauri-apps/api/event": "../assets/vendor/@tauri-apps/api/event.js",
      "@tauri-apps/api/path": "../assets/vendor/@tauri-apps/api/path.js",
      "@tauri-apps/api/window": "../assets/vendor/@tauri-apps/api/window.js",
      "@tauri-apps/plugin-fs": "../assets/vendor/@tauri-apps/plugin-fs/index.js",
      "@tauri-apps/plugin-opener": "../assets/vendor/@tauri-apps/plugin-opener/index.js"
    }
  }
  </script>
</head>
<body>
  <div class="overlay"></div>
  <main class="app-shell" id="appShell">
    <div class="topbar-actions">
      <button id="openMenu" class="action-btn" aria-label="Меню UniDTK">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12" />
          <line x1="3" y1="6" x2="21" y2="6" />
          <line x1="3" y1="18" x2="21" y2="18" />
        </svg>
      </button>
      <button id="editMode" class="action-btn" aria-label="Переместить виджеты">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2l3 3-3 3" /><path d="M12 8V2" />
          <path d="M2 12l3-3 3 3" /><path d="M8 12H2" />
          <path d="M12 22l-3-3 3-3" /><path d="M12 16v6" />
          <path d="M22 12l-3 3-3-3" /><path d="M16 12h6" />
        </svg>
      </button>
      <button id="resetWallpaper" class="action-btn" aria-label="Сбросить обои">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10" />
          <path d="M3.51 15a9 9 0 105.64-11.36L1 10" />
        </svg>
      </button>
      <button id="quitApp" class="action-btn" aria-label="Выход">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg>
      </button>
    </div>

    <div id="widgets" class="widgets-canvas"></div>
  </main>


  <div id="debugMessage" class="debug-message hidden">Debug</div>

  <div id="shell-portals"></div>

  <div class="explorer-overlay" id="explorerOverlay">
    <div class="explorer-container" id="explorerContainer">
      <div class="explorer-widget" id="explorer">
        <div class="tab-bar" id="tabBar">
          <div class="tabs-container" id="tabsContainer"></div>
          <button class="tab-add" id="tabAdd" aria-label="New tab">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="stroke: rgba(var(--fg-rgb), 0.7);" stroke-width="1.5" stroke-linecap="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
          </button>
        </div>
        <div class="toolbar" id="toolbar">
          <div class="nav-buttons">
            <button class="nav-btn" id="btnBack" disabled aria-label="Back">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="stroke: rgba(var(--fg-rgb), 0.7);" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"/>
              </svg>
            </button>
            <button class="nav-btn" id="btnForward" disabled aria-label="Forward">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="stroke: rgba(var(--fg-rgb), 0.7);" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="9 18 15 12 9 6"/>
              </svg>
            </button>
            <button class="nav-btn" id="btnUp" aria-label="Up">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="stroke: rgba(var(--fg-rgb), 0.7);" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="18 15 12 9 6 15"/>
              </svg>
            </button>
          </div>
          <div class="path-bar" id="pathBar"></div>
          <div class="search-box" id="searchBox">
            <svg class="search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
            </svg>
            <input type="text" id="searchInput" placeholder="Search…">
            <div class="search-results" id="searchResults"></div>
          </div>
          <div class="toolbar-right">
            <div class="view-toggle" id="viewToggle">
              <button class="view-btn active" id="viewGrid" aria-label="Grid view">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="stroke: rgba(var(--fg-rgb), 0.7);" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/>
                  <rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/>
                </svg>
              </button>
              <button class="view-btn" id="viewList" aria-label="List view">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="stroke: rgba(var(--fg-rgb), 0.7);" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
                  <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
                  <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
                </svg>
              </button>
            </div>
            <button class="nav-btn" id="btnPreview" aria-label="Toggle preview">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="stroke: rgba(var(--fg-rgb), 0.7);" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="3" width="20" height="14" rx="2" ry="2"/>
                <line x1="13" y1="3" x2="13" y2="17"/>
              </svg>
            </button>
            <button class="nav-btn" id="btnRefresh" aria-label="Refresh">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" style="stroke: rgba(var(--fg-rgb), 0.7);" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/>
                <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15"/>
              </svg>
            </button>
          </div>
        </div>
        <div class="content-area" id="contentArea">
          <div class="sidebar" id="sidebar">
            <div class="sidebar-section">
              <div class="sidebar-header">Places</div>
              <div class="sidebar-items" id="placesList"></div>
            </div>
            <div class="sidebar-section">
              <div class="sidebar-header">Favorites</div>
              <div class="sidebar-items" id="favoritesList"></div>
            </div>
            <div class="sidebar-section">
              <div class="sidebar-header">Drives</div>
              <div class="sidebar-items" id="drivesList"></div>
            </div>
          </div>
          <div class="file-area" id="fileArea">
            <div class="file-grid" id="fileGrid"></div>
            <div class="file-list hidden" id="fileList">
              <div class="file-header" id="fileHeader">
                <div class="col-name" data-sort="name"><span>Name</span><span class="sort-indicator"></span></div>
                <div class="col-size" data-sort="size"><span>Size</span><span class="sort-indicator"></span></div>
                <div class="col-type" data-sort="type"><span>Type</span><span class="sort-indicator"></span></div>
                <div class="col-modified" data-sort="modified"><span>Modified</span><span class="sort-indicator"></span></div>
              </div>
              <div class="file-list-body" id="fileListBody"></div>
            </div>
            <div class="empty-state hidden" id="emptyState">
              <div class="empty-icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/>
                </svg>
              </div>
              <div class="empty-text">This folder is empty</div>
              <div class="empty-hint">Double-click a drive or folder to open · Enter opens selection</div>
            </div>
          </div>
          <div class="preview-panel" id="previewPanel">
            <div class="preview-placeholder" id="previewPlaceholder">
              <div class="preview-empty-icon">
                <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/>
                  <polyline points="14 2 14 8 20 8"/>
                </svg>
              </div>
              <div class="preview-empty-text">Select a file<br>to preview</div>
            </div>
            <div class="preview-content hidden" id="previewContent">
              <div class="preview-image-container" id="previewImageContainer"></div>
              <div class="preview-header" id="previewFileName"></div>
              <div class="preview-meta" id="previewMeta">
                <div class="meta-row"><span class="meta-label">Type</span><span class="meta-value" id="metaType"></span></div>
                <div class="meta-row"><span class="meta-label">Size</span><span class="meta-value" id="metaSize"></span></div>
                <div class="meta-row"><span class="meta-label">Modified</span><span class="meta-value" id="metaModified"></span></div>
                <div class="meta-row"><span class="meta-label">Created</span><span class="meta-value" id="metaCreated"></span></div>
              </div>
              <div class="preview-hashes" id="previewHashes">
                <button type="button" class="hash-btn" id="btnHashMd5">MD5</button>
                <button type="button" class="hash-btn" id="btnHashSha">SHA-256</button>
                <div class="hash-result hidden" id="hashResult"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="status-bar" id="statusBar">
          <span id="statusItems">0 items</span>
          <span id="statusHint" class="status-hint">Double-click to open</span>
          <span id="statusFree"></span>
        </div>
        <div class="context-menu hidden" id="contextMenu"></div>
        <div class="loading-overlay hidden" id="loadingOverlay">
          <div class="loading-spinner"></div>
        </div>
      </div>
    </div>
  </div>

  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-container" id="menuContainer"></div>
  </div>

  <script type="module" src="boot-log.js"></script>
  <script type="module" src="harness.js"></script>
  <script type="module" src="renderer.js"></script>
</body>
</html>
