[package]
name = "unidtk-api"
version = "0.1.0"
edition = "2021"
description = "Stable contract between the UniDTK kernel and its modules"

# The contract is deliberately thin: no tauri, no redb, no Win32. A module must
# be able to depend on this crate alone (architecture §1.3 — updating the core
# must not break modules). `serde_json` carries event payloads; `dirs` resolves
# the shared data directory so modules do not need the kernel for that either.

[lib]
name = "unidtk_api"
path = "src/lib.rs"

[dependencies]
serde_json = "1"
dirs = "5"
