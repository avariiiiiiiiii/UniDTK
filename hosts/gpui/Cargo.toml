[package]
name = "unidtk-gpui"
version = "0.1.0"
edition = "2021"

[dependencies]
gpui = "0.2.2"
raw-window-handle = "0.6"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
unidtk-api = { path = "../../core/api" }
unidtk-mod-glyph-bar = { path = "../../modules/glyph-bar/rust" }
unidtk-mod-vpn = { path = "../../modules/vpn/rust" }
unidtk-mod-micrographics = { path = "../../modules/micrographics/rust" }
unidtk-mod-mp3-player = { path = "../../modules/mp3-player/rust" }
redb = "2.1"
dirs = "5"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_DirectComposition",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_Storage_FileSystem",
] }

